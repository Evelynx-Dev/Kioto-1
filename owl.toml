[project]
name = "kioto"
version = "2.4.3"
description = "Standard library for Mire"
entry = "code/mod.mire"

[build]
compiler = "mire"
profile = "debug"
opt-level = 0

[paths]
sources = "."
tests = "tests"
output = "bin"
cache = "bin/.cache"

[dependencies]
mire = { path = "../mire" }

[exports]
strings = "core/strings"
time    = "core/time"
fs      = "core/fs"
env     = "core/env"
proc    = "core/proc"
async   = "core/async"
mem     = "core/mem"
cpu     = "core/cpu"
math    = "core/math"
net     = "core/net"
log     = "core/log"
cli     = "core/cli"
crypto  = "core/crypto"
